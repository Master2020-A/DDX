version: '3.8'

services:
  n8n:
    image: n8nio/n8n:latest
    container_name: ddx-n8n
    restart: always
    ports:
      - "5678:5678"
    environment:
      # Autenticación básica (deshabilitada para permitir registro)
      - N8N_BASIC_AUTH_ACTIVE=false
      
      # Configuración del servidor
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      
      # URLs
      - WEBHOOK_URL=http://localhost:5678/
      
      # Zona horaria
      - GENERIC_TIMEZONE=America/Mexico_City
      - TZ=America/Mexico_City
      
      # Base de datos (SQLite por defecto, cambiar a PostgreSQL en producción)
      - DB_TYPE=sqlite
      - DB_SQLITE_DATABASE=/home/node/.n8n/database.sqlite
      
      # Ejecuciones
      - EXECUTIONS_DATA_SAVE_ON_ERROR=all
      - EXECUTIONS_DATA_SAVE_ON_SUCCESS=all
      - EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS=true
      
      # Logs
      - N8N_LOG_LEVEL=info
      - N8N_LOG_OUTPUT=console,file
      
    volumes:
      # Persistencia de datos
      - n8n_data:/home/node/.n8n
      
      # Workflows (opcional, para versionarlos)
      - ./n8n/workflows:/home/node/.n8n/workflows
      
      # Credenciales (opcional)
      - ./n8n/credentials:/home/node/.n8n/credentials
    
    networks:
      - ddx-network
    
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5678/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # PostgreSQL para N8N (producción)
  n8n-postgres:
    image: postgres:15-alpine
    container_name: ddx-n8n-postgres
    restart: always
    environment:
      - POSTGRES_USER=n8n
      - POSTGRES_PASSWORD=n8n_password_2024
      - POSTGRES_DB=n8n
    volumes:
      - n8n_postgres_data:/var/lib/postgresql/data
    networks:
      - ddx-network
    profiles:
      - production

volumes:
  n8n_data:
    driver: local
  n8n_postgres_data:
    driver: local

networks:
  ddx-network:
    driver: bridge

# ========================================
# INSTRUCCIONES DE USO
# ========================================
#
# DESARROLLO (SQLite):
# docker-compose -f docker-compose.n8n.yml up -d
#
# PRODUCCIÓN (PostgreSQL):
# 1. Cambiar en servicio n8n:
#    - DB_TYPE=postgresdb
#    - DB_POSTGRESDB_HOST=n8n-postgres
#    - DB_POSTGRESDB_PORT=5432
#    - DB_POSTGRESDB_DATABASE=n8n
#    - DB_POSTGRESDB_USER=n8n
#    - DB_POSTGRESDB_PASSWORD=n8n_password_2024
# 2. docker-compose -f docker-compose.n8n.yml --profile production up -d
#
# ACCESO:
# http://localhost:5678
# Usuario: admin
# Password: ddx_n8n_2024
#
# DETENER:
# docker-compose -f docker-compose.n8n.yml down
#
# VER LOGS:
# docker-compose -f docker-compose.n8n.yml logs -f n8n
